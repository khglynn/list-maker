name = "list-maker-cron"
main = "worker.js"
compatibility_date = "2026-06-06"

# PERSONAL (trimm) Cloudflare account — kevin@trimm.co.
account_id = "759a850a3af3e2fbf1ab036e7eb2f231"

# The durable control plane for BOTH workflows (entities + music). Times are UTC and
# mirror what used to live in each workflow's `schedule:` block — removed, because
# GitHub silently disables public-repo crons after 60 idle days. The cron strings
# below must stay in sync with the SCHEDULE map in worker.js.
# MAX 5 crons — Workers Free hard-caps cron triggers per Worker at 5 (a 7-cron
# deploy failed on 2026-06-11). Music = ONE Mon/Wed/Fri cron; worker.js picks the
# show by fire day.
[triggers]
crons = [
  "0 11 * * *",     # daily — entities.yml (AI Daily, Hard Fork, PCHH, Gabfest)
  "0 10 * * 1,3,5", # Mon/Wed/Fri — pipeline.yml (Mon=TAL, Wed+Fri=SOP; day picked in worker.js)
  "0 12 * * 1",     # Mon   — eval.yml (weekly extraction-quality eval, gated)
  "0 13 * * 1",     # Mon   — blogs.yml (blog pull queue: discover + ingest checked)
  "30 13 1,15 * *", # 1st+15th — pulse.yml (staggered past blogs so it never reports mid-run)
]
