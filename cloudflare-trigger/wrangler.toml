name = "list-maker-cron"
main = "worker.js"
compatibility_date = "2026-06-06"

# PERSONAL (trimm) Cloudflare account — kevin@trimm.co.
account_id = "759a850a3af3e2fbf1ab036e7eb2f231"

# The durable control plane for ALL of list-maker's workflows. Times are UTC and
# mirror what used to live in each workflow's `schedule:` block — removed, because
# GitHub silently disables public-repo crons after 60 idle days.
#
# ONE cron as of 2026-08-26 (was five). The Workers Free cap is 5 cron triggers
# PER ACCOUNT — verified against developers.cloudflare.com/workers/platform/limits
# (an earlier comment here said per Worker; the 2026-06-11 7-cron deploy failure
# couldn't tell the two apart because this was the account's only cron Worker).
# Kevin's call 2026-08-26: consolidate to the minimum so other projects
# (remembrall-hub's 15-min sync) get slots. worker.js fans the single daily fire
# out to the right workflows by day-of-week and day-of-month — the dispatch
# cadence PER WORKFLOW is unchanged in kind (daily/Mon/Wed/Fri/1st+15th), only
# the minute moved: everything now dispatches at 20:30 UTC (~3:30pm CT), which
# was already the entities time, so the AI Daily brief's cadence is untouched.
# The old :00/:15/:45/:55 staggers existed to spread Slack pings within the
# anchor window; GitHub Actions queues concurrent dispatches fine, and the
# workflows' differing runtimes spread the pings anyway — accepted.
#
# ⚠️ If a cron is ever added back here: CLOUDFLARE DAY-OF-WEEK IS
# 1=Sunday..7=Saturday (not standard cron's 0=Sunday). That mismatch cost six
# weeks of missed Monday runs in 2026-06/07. The day logic now lives in
# worker.js using JS Date (Mon=1), where it's testable.
[triggers]
crons = [
  "30 20 * * *", # daily ~3:30pm CT — worker.js picks the day's dispatches
]

# Where a dispatch is remembered long enough to ask what became of it. Two kinds of
# key: `dispatch:<workflow>:<iso>` (one per successful dispatch, 3-day TTL, deleted
# once judged) and `meta:last_fire` / `meta:last_verify` (what GET /health returns).
# Small and short-lived by design — this is a receipt drawer, not a database.
#
# ⚠️ The id below is a PLACEHOLDER. Create the namespace once, on the personal
# (trimm) account, and paste the id it prints:
#     cd cloudflare-trigger
#     npx wrangler whoami        # must say Kevin@trimm.co's Account — if Tecovas, STOP
#     env -u CLOUDFLARE_API_TOKEN npx wrangler kv namespace create DISPATCH_LOG
# The placeholder is not a valid namespace id, so a deploy before the paste is
# expected to be rejected at upload rather than binding nothing. The Worker is
# written to survive it either way: every KV touch is best-effort, dispatching
# still happens, and /health then reports no last_fire — which is exactly the
# staleness fleet-watchdog alarms on.
[[kv_namespaces]]
binding = "DISPATCH_LOG"
id = "25cd703724ea440888f716e485cb6049"
