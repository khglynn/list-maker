name = "list-maker-cron"
main = "worker.js"
compatibility_date = "2026-06-06"

# PERSONAL (trimm) Cloudflare account — kevin@trimm.co.
account_id = "759a850a3af3e2fbf1ab036e7eb2f231"

# The durable control plane for BOTH workflows (entities + music). Times are UTC and
# mirror what used to live in each workflow's `schedule:` block — removed, because
# GitHub silently disables public-repo crons after 60 idle days. The cron strings
# below must stay in sync with the SCHEDULE map in worker.js.
# MAX 5 crons — Workers Free hard-caps cron triggers per Worker at 5 (a 7-cron
# deploy failed on 2026-06-11). Music = ONE Mon/Wed/Fri cron; worker.js picks the
# show by fire day.
[triggers]
# ⚠️ CLOUDFLARE DAY-OF-WEEK IS 1=Sunday..7=Saturday (their docs call this out) — NOT
# standard cron's 0=Sunday. The original values (1,3,5 / 1) assumed standard cron and
# fired Sun/Tue/Thu + Sun for six weeks (2026-06-11→07-24), so TAL never auto-synced.
# Cloudflare: Mon=2, Wed=4, Fri=6.
# ALL crons live in Kevin's ~3pm-CT anchor window as of 2026-07-27 (his call:
# non-critical Slack pings arrive at roughly the same time every day; only true
# alarms may ping off-hours). The old 10:00/11:00/12:00 UTC values ran pre-dawn
# CT, so a failure ping could land at 5am. Content now lands ~3-4pm instead of
# ~6am — accepted tradeoff. Times are UTC, so the CT window shifts an hour when
# DST ends (15:xx CDT → 14:xx CST); that stays inside the afternoon, fine.
# Staggered :30/:45/:55 to clear blogs (:00) and pulse (:15) on Mondays.
crons = [
  "30 20 * * *",    # daily ~3:30pm CT — entities.yml (AI Daily, Hard Fork, PCHH, Gabfest)
  "45 20 * * 2,4,6",# Mon/Wed/Fri ~3:45pm CT — pipeline.yml (Mon=TAL, Wed+Fri=SOP; day picked in worker.js — 20:45 UTC keeps getUTCDay()===Mon)
  "55 20 * * 2",    # Mon ~3:55pm CT — eval.yml (weekly extraction-quality eval, gated)
  "0 20 * * 2",     # Mon ~3:00pm CT — blogs.yml (report-style sends live in Kevin's 3pm anchor window)
  "15 20 1,15 * *", # 1st+15th ~3:15pm CT — pulse.yml (report-style; staggered past blogs for Monday collisions)
]
