name: Entities + Media (AI Daily, Hard Fork, PCHH, Gabfest)

on:
  # Interim daily trigger (works today). The DURABLE trigger is a Cloudflare Worker
  # Cron calling workflow_dispatch (see cloudflare-trigger/) — once it's deployed,
  # remove this schedule: block (public repos auto-disable scheduled crons after
  # 60 days of inactivity; the Worker doesn't have that limit).
  schedule:
    - cron: '0 11 * * *'   # daily 11:00 UTC (~5-6 AM Central)
  workflow_dispatch:
    inputs:
      shows:
        description: 'Comma-separated entity/media show slugs'
        required: false
        default: 'ai-daily-brief,hard-fork,pchh,culture-gabfest'
      backfill:
        description: 'Backfill the full archive (ignore the recent-only window)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (preview only)'
        required: false
        type: boolean
        default: false

jobs:
  run-entities:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run entity pipeline
        # Step-level timeout (< job timeout) so a hang FAILS this step (→ Slack alert)
        # instead of cancelling the job, which would skip the if:failure() notify.
        timeout-minutes: 50
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TADDY_USER_ID: ${{ secrets.TADDY_USER_ID }}
          TADDY_API_KEY: ${{ secrets.TADDY_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Inputs via env (never interpolate ${{ inputs }} directly into run: — injection).
          SHOWS_INPUT: ${{ github.event.inputs.shows }}
          BACKFILL_INPUT: ${{ github.event.inputs.backfill }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          SHOWS="${SHOWS_INPUT:-ai-daily-brief,hard-fork,pchh,culture-gabfest}"
          FLAGS=""
          [ "$BACKFILL_INPUT" = "true" ] && FLAGS="$FLAGS --backfill"
          [ "$DRY_RUN_INPUT" = "true" ] && FLAGS="$FLAGS --dry-run"
          cd pipeline
          python run_new_episodes.py --shows "$SHOWS" $FLAGS

      - name: Data health check (staleness, integrity, feed second-source)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TADDY_USER_ID: ${{ secrets.TADDY_USER_ID }}   # second-source: are we behind the feed?
          TADDY_API_KEY: ${{ secrets.TADDY_API_KEY }}
        run: |
          # No `|| true`: a crash here should fail the step (→ Slack), not vanish.
          # data_health.py posts its own Slack on a failed check (e.g. a stale show).
          cd pipeline && python data_health.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack (success)
        if: success() && github.event.inputs.dry_run != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS --retry 3 -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            --data "{\"text\": \":white_check_mark: *list-maker: entity pipeline ran*\n<${RUN_URL}|View logs>\"}"

      - name: Notify Slack (failure)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS --retry 3 -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            --data "{\"text\": \":rotating_light: *list-maker: entity pipeline FAILED*\n<${RUN_URL}|View logs>\"}"

      - name: Create issue on failure (non-dry-run)
        if: failure() && github.event.inputs.dry_run != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Entity pipeline failure (${new Date().toISOString().split('T')[0]})`,
              body: `The scheduled entity pipeline run failed.\n\n**Run:** ${runUrl}`,
              labels: ['pipeline-failure'],
            });
