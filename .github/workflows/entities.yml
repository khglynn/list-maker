name: Entities + Media (AI Daily, Hard Fork, PCHH, Gabfest)

# shell: bash turns on pipefail for run steps — without it, `cmd | tee` reports tee's
# exit code and a crashed script reads as "success" (bit pipeline.yml for six weeks).
defaults:
  run:
    shell: bash

on:
  # No schedule: block on purpose — the Cloudflare Worker cron (cloudflare-trigger/)
  # is the durable trigger (daily; the exact time lives in worker.js's dispatchesFor —
  # don't restate it here, that's how three stale copies happened). GitHub's own
  # cron silently disables on public repos after 60 idle days; the Worker doesn't,
  # and a failed dispatch alerts. Verified live 2026-06-11 (GH_PAT = the reused
  # fine-grained GITHUB_HG_CLAUDE_TOKEN, expires 2027-01-20 — dispatch failures
  # will Slack when it does).
  workflow_dispatch:
    inputs:
      shows:
        description: 'Comma-separated entity/media show slugs'
        required: false
        default: 'ai-daily-brief,hard-fork,pchh,culture-gabfest'
      backfill:
        description: 'Backfill the full archive (ignore the recent-only window)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (preview only)'
        required: false
        type: boolean
        default: false
      pulse:
        description: 'Post the biweekly pulse AFTER this run (the Worker sets this on the 1st + 15th)'
        required: false
        type: boolean
        default: false

# The announce step opens and closes failure issues. This repo's GITHUB_TOKEN is read-only
# by default, so without `issues: write` the old issue step failed on every failure it ever
# handled ("Resource not accessible by integration", 2026-06 → 2026-08-31): the Slack ping
# fired, the issue never existed, and a failing notify step looks exactly like the failure
# it was reporting. Least privilege otherwise.
# One run of this workflow at a time. A manual re-run or the Worker's HTTP trigger
# overlapping a scheduled dispatch would run two orchestrators against the same Neon
# tables (and, for music, the same playlist). The writes are designed idempotent, but
# that has never been exercised under two concurrent writers — queue instead. Never
# cancel-in-progress: a run stopped mid-write is worse than one that waits.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  run-entities:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The shows this run imports (a manual run may narrow them). An input reaches
      # the shell only through env, never interpolated into run: text.
      ENTITY_SHOWS: ${{ github.event.inputs.shows || 'ai-daily-brief,hard-fork,pchh,culture-gabfest' }}
      # Where steps leave detail for the announce step: data_health's results, the
      # preflight's diagnostics, mid-run notes (common.alert_note).
      ALERT_DETAILS_DIR: ${{ github.workspace }}/.alert-details

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: DB preflight (fail fast if Neon is unreachable from this runner)
        # One bounded connect attempt before any real work. On 2026-08-31 a runner with
        # a dead path to the pooler spent 41 minutes rediscovering that in every step;
        # this ends the job in about a minute and Slacks the diagnostics instead.
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: cd pipeline && python db_preflight.py

      - name: Run entity pipeline
        id: import
        # Step-level timeout (< job timeout) so a hang FAILS this step (→ Slack alert)
        # instead of cancelling the job, which would skip the if:failure() notify.
        timeout-minutes: 50
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TADDY_USER_ID: ${{ secrets.TADDY_USER_ID }}
          TADDY_API_KEY: ${{ secrets.TADDY_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Inputs via env (never interpolate ${{ inputs }} directly into run: — injection).
          BACKFILL_INPUT: ${{ github.event.inputs.backfill }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          FLAGS=""
          [ "$BACKFILL_INPUT" = "true" ] && FLAGS="$FLAGS --backfill"
          [ "$DRY_RUN_INPUT" = "true" ] && FLAGS="$FLAGS --dry-run"
          cd pipeline
          python run_new_episodes.py --shows "$ENTITY_SHOWS" $FLAGS

      - name: Sync transcripts to Notion (Transcripts DB)
        id: notion
        # Runs even if the pipeline step failed: syncs whatever DID land in Neon.
        # Idempotent (notion_transcript_page_id gate) + adopt-don't-duplicate on resume,
        # so a daily run is safe and a no-new-episodes day is a cheap no-op.
        # This step was the missing link behind the June 2026 Transcripts-DB freeze.
        # Gated on the preflight: if the DB was unreachable, don't re-pay the wait here.
        if: always() && steps.preflight.outcome == 'success'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          cd pipeline
          python sync_transcripts_notion.py --target transcripts
          # Belt-and-suspenders for blog posts: save_item syncs at ingest time, but a
          # failed/missed sync heals here daily (cheap no-op when nothing is unsynced).
          python sync_transcripts_notion.py --target blog-posts

      - name: Data health check (staleness, integrity, feed second-source)
        id: health
        if: always() && steps.preflight.outcome == 'success'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TADDY_USER_ID: ${{ secrets.TADDY_USER_ID }}   # second-source: are we behind the feed?
          TADDY_API_KEY: ${{ secrets.TADDY_API_KEY }}
        run: |
          # No `|| true`: a crash here should fail the step (→ Slack), not vanish.
          # --results-file: the announce step reads which checks failed from here;
          # data_health no longer posts to Slack itself.
          # --strict: a real failure reddens the run (Slack + the failure issue), the way
          # pipeline.yml's feed check already does. Safe now that the grace windows have
          # removed the false-positive volume — a red X here should mean something.
          # --music-as-backstop: a music show's normal wait between imports is
          # pipeline.yml's to judge (it checks right after each import); this run fails
          # one only a week past its window, as the backstop for pipeline.yml not running.
          # Which shows count as music comes from show_config, not from $ENTITY_SHOWS, so
          # a narrower manual run can't move its skipped shows onto the backstop window.
          cd pipeline && python data_health.py --strict --music-as-backstop \
            --results-file "$ALERT_DETAILS_DIR/health.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the failed batch (dead letter)
        # A broken extraction batch used to leave nothing but a 500-character stderr tail
        # in an expiring log. Keep the batch directory so it can be inspected or replayed
        # without re-running the whole show. eval.yml does the same for its report.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: extraction-batches-${{ github.run_id }}
          path: codex-notes/ai-daily-entity-extraction/incremental-*
          if-no-files-found: ignore
          retention-days: 14

      # No per-run success ping — daily shows (AI Daily, PCHH) would spam the channel.
      # The biweekly pulse is the positive report; the announce step speaks only when
      # something changes.
      # The run's one voice (pipeline/announce.py): Slack and the failure issues, once per
      # change of state — a new failure, a changed set of failures, "recovered" on the
      # first green — plus a weekly reminder while a failure lasts. Always runs, so a green
      # run can close what it fixed. Replaced (2026-09-23) the separate speakers that made
      # every red day two pings and a comment on an issue that never closed.
      - name: Announce (Slack + failure issues, once per change)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        # python3, standard library only: this must still run when setup or the
        # dependency install is what failed.
        run: |
          if [ ! -f pipeline/announce.py ]; then
            # Checkout itself failed, so the announcer isn't on disk. Say that much
            # rather than nothing (the one case the announcer can't cover).
            if [ "$JOB_STATUS" != "success" ] && [ -n "$SLACK_WEBHOOK_URL" ]; then
              curl -sS --retry 3 -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
                --data "{\"text\": \":rotating_light: *list-maker · $GITHUB_WORKFLOW* failed before its code was checked out, so it could not say why. <${RUN_URL}|View the run>\"}"
            fi
            exit 0
          fi
          ARGS=(--workflow entities)
          [ "$DRY_RUN_INPUT" = "true" ] && ARGS+=(--dry-run)
          python3 pipeline/announce.py "${ARGS[@]}"

  pulse:
    # The biweekly heartbeat reads the same tables run-entities just filled. From June to
    # 2026-09-01 it was its own workflow, dispatched at the same minute, so it usually
    # queried Neon BEFORE the day's import landed and reported shows "BEHIND" that were
    # caught up five minutes later. Running it here, after the import, is the fix.
    # `always()` on purpose: a failed import is exactly when a truthful pulse matters.
    needs: run-entities
    if: always() && github.event.inputs.pulse == 'true'
    uses: ./.github/workflows/pulse.yml
    secrets: inherit
