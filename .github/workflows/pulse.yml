name: Pulse Report (health heartbeat)

# A POSITIVE heartbeat to Slack: per-show freshness, library counts, any actionable
# failures, and an "all systems firing" confirmation. Complements the push failure-alerts
# (which only fire FROM a run) by covering the one blind spot — if the pulse stops
# arriving, the trigger itself is down. But a heartbeat you have to NOTICE is missing is
# a weak alarm, and this one only beats twice a month.
#
# The ACTIVE dead-trigger alert this comment used to call for (a Sentry Cron Monitor
# check-in) exists as of 2026-09-03 without a new vendor: the Cloudflare Worker records
# every fire and serves it at GET /health, and fleet-watchdog — a Worker in
# khglynn/self-hosted-mcps that already polls Kevin's other services — alerts when that
# timestamp goes stale. See cloudflare-trigger/README.md § "Did the work actually run?".
#
# No schedule: — the Cloudflare Worker drives the cadence (1st + 15th), same as the rest
# of the pipeline, so there's no GitHub 60-day-disable. Since 2026-09-01 the Worker asks
# entities.yml to run this as a follow-on job (workflow_call) instead of dispatching it
# separately: a same-minute dispatch read Neon before the day's import and cried
# "BEHIND". workflow_dispatch stays for a manual pulse from the Actions tab.
# shell: bash turns on pipefail for run steps — without it, `cmd | tee` reports tee's
# exit code and a crashed script reads as "success" (bit pipeline.yml for six weeks).
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
  workflow_call:

# One pulse at a time, so a manual pulse overlapping the Worker's can't post two
# heartbeats. The group is a LITERAL on purpose. This file usually runs as a called
# workflow (entities.yml's `pulse` job, via workflow_call), and inside a called
# workflow `github.workflow` evaluates to the CALLER's name. So the
# `${{ github.workflow }}` group the other workflows use became "Entities + Media (…)",
# the group the calling run already holds, and GitHub cancelled the pulse as a deadlock
# ("deadlock was detected for concurrency group … between a top level workflow and
# 'pulse'"). The run's failure hooks live in the job that passed, so nothing said so:
# the 2026-09-15 pulse never ran, and none had posted since 09-01.
# tests/test_workflows.py keeps a caller-derived group out of every called workflow.
concurrency:
  group: list-maker-pulse
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: DB preflight (fail fast if Neon is unreachable from this runner)
        # One bounded connect attempt before any real work. On 2026-08-31 a runner with
        # a dead path to the pooler spent 41 minutes rediscovering that in every step;
        # this ends the job in about a minute and Slacks the diagnostics instead.
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: cd pipeline && python db_preflight.py

      - name: Post pulse to Slack
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TADDY_USER_ID: ${{ secrets.TADDY_USER_ID }}   # second source (are we behind the feed?)
          TADDY_API_KEY: ${{ secrets.TADDY_API_KEY }}
        run: cd pipeline && python pulse_report.py

      - name: Notify Slack (failure)
        # The pulse is the only POSITIVE signal in the system; until 2026-09-01 it could
        # die with no message at all. Not when the preflight failed — it already posted.
        if: failure() && steps.preflight.outcome != 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS --retry 3 -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            --data "{\"text\": \":rotating_light: *list-maker: pulse FAILED* — no heartbeat was posted.\n<${RUN_URL}|View logs>\"}"
