name: Blog Pull Queue (weekly discover + ingest checked)

on:
  # Interim weekly trigger — the ONE workflow still on a GitHub schedule. The
  # Worker secrets are live (verified 2026-06-11) but the deployed Worker predates
  # the blogs cron; once Kevin runs `wrangler deploy` in cloudflare-trigger/,
  # remove this schedule: block (public repos auto-disable crons after 60 idle
  # days; the Worker doesn't).
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC (~8 AM Central)
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Discover/enrich only — skip ingesting checked rows'
        required: false
        type: boolean
        default: false

jobs:
  pull-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Build queue + ingest checked rows
        timeout-minutes: 40
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD_ONLY_INPUT: ${{ github.event.inputs.build_only }}
        run: |
          FLAGS="--build --ingest"
          [ "$BUILD_ONLY_INPUT" = "true" ] && FLAGS="--build"
          cd pipeline
          python build_pull_queue.py $FLAGS

      - name: Notify Slack (failure)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS --retry 3 -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            --data "{\"text\": \":rotating_light: *list-maker: blog pull queue FAILED*\n<${RUN_URL}|View logs>\"}"
