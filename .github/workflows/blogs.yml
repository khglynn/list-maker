name: Curated intake (weekly discover + judge)

# shell: bash turns on pipefail for run steps — without it, `cmd | tee` reports tee's
# exit code and a crashed script reads as "success" (bit pipeline.yml for six weeks).
defaults:
  run:
    shell: bash

on:
  # No schedule: block on purpose — the Cloudflare Worker cron (cloudflare-trigger/)
  # is the durable trigger (Mondays; the time lives in worker.js's dispatchesFor —
  # don't restate it here). GitHub's own cron
  # silently disables on public repos after 60 idle days; the Worker doesn't, and a
  # failed dispatch alerts. Deployed + verified 2026-06-11.
  workflow_dispatch:
    inputs:
      dry_run:
        # Replaced `build_only` on 2026-09-02. That input split a build phase from an
        # ingest phase, and the judged intake has neither — discovery, judging and the
        # override ingest are one pass. `dry_run` is the input that still means
        # something: run discovery and the free pre-checks and print the plan, writing
        # nothing to Neon, Notion, or a model.
        description: 'Preview only — discovery + pre-checks, no writes and no model calls'
        required: false
        type: boolean
        default: false
      sources:
        # The podcast-cited half is worth running on its own between Mondays: a report
        # cited on Monday's episode can be resolved and judged Tuesday.
        description: 'Which sources to run'
        required: false
        type: choice
        options: [all, feeds, podcast-cited]
        default: all

# One run of this workflow at a time. A manual re-run or the Worker's HTTP trigger
# overlapping a scheduled dispatch would run two orchestrators against the same Neon
# tables (and, for music, the same playlist). The writes are designed idempotent, but
# that has never been exercised under two concurrent writers — queue instead. Never
# cancel-in-progress: a run stopped mid-write is worse than one that waits.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: DB preflight (fail fast if Neon is unreachable from this runner)
        # One bounded connect attempt before any real work. On 2026-08-31 a runner with
        # a dead path to the pooler spent 41 minutes rediscovering that in every step;
        # this ends the job in about a minute and Slacks the diagnostics instead.
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: cd pipeline && python db_preflight.py

      - name: Ensure the Notion intake log has the properties this run writes
        # Idempotent and additive: adds missing properties and Status options, renames
        # Pull → "Pull anyway", refreshes the title/description prose. Never removes a
        # property, an option, or a row. Explicit rather than a side effect of judging,
        # so a weekly run can never quietly restructure Kevin's database.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: cd pipeline && python run_intake.py --ensure-log-schema

      - name: Discover, judge, log
        timeout-minutes: 60
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # the two judge models
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}           # entity extraction on an override ingest
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          SOURCES_INPUT: ${{ github.event.inputs.sources }}
        run: |
          # Inputs reach the shell through env vars and are whitelisted before use:
          # a workflow_dispatch input is caller-supplied text, and this step runs with
          # every secret the pipeline has.
          SOURCES="${SOURCES_INPUT:-all}"
          case "$SOURCES" in
            all|feeds|podcast-cited) ;;
            *) echo "unexpected sources input: $SOURCES" >&2; exit 1 ;;
          esac
          ARGS=(--sources "$SOURCES")
          if [ "$DRY_RUN_INPUT" = "true" ]; then ARGS+=(--dry-run); fi
          cd pipeline
          python run_intake.py "${ARGS[@]}"

      - name: Notify Slack (failure)
        # Not when the preflight failed — it already posted the diagnostics.
        if: failure() && steps.preflight.outcome != 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS --retry 3 -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            --data "{\"text\": \":rotating_light: *list-maker: curated intake FAILED*\n<${RUN_URL}|View logs>\"}"
