name: Pipeline - Update Playlists

# Without an explicit bash shell, GitHub runs steps with bash -e but NOT -o pipefail —
# so `python ... | tee out.txt` reports tee's exit (0) and a crashed pipeline reads as
# "success" (masked every scheduled Spotify-auth failure 2026-06-11→07-24, and the
# failure-Slack step never fired). shell: bash turns on pipefail for every run step.
defaults:
  run:
    shell: bash

on:
  # No schedule: block on purpose — the Cloudflare Worker cron (cloudflare-trigger/)
  # is the durable trigger (SOP Wed+Fri, TAL Mon; the time lives in worker.js's
  # dispatchesFor — don't restate it here).
  # GitHub's own cron silently disables on public repos after 60 idle days; the
  # Worker doesn't, and a failed dispatch alerts. Verified live 2026-06-11.

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      show_id:
        description: 'Show to process'
        required: true
        type: choice
        options:
          - '1'   # SOP
          - '2'   # TAL
          - '3'   # AI Daily
          - 'all'
      dry_run:
        description: 'Dry run (preview only, no changes)'
        required: false
        type: boolean
        default: false

# `issues: write` so the announce step can open and close failure issues — GITHUB_TOKEN is
# read-only by default here, and the old issue step had silently failed on every failure
# since June 2026 (see entities.yml for the story). Least privilege otherwise.
# One run of this workflow at a time. A manual re-run or the Worker's HTTP trigger
# overlapping a scheduled dispatch would run two orchestrators against the same Neon
# tables (and, for music, the same playlist). The writes are designed idempotent, but
# that has never been exercised under two concurrent writers — queue instead. Never
# cancel-in-progress: a run stopped mid-write is worse than one that waits.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Where steps leave detail for the announce step: data_health's results, the
      # preflight's diagnostics, mid-run notes (common.alert_note).
      ALERT_DETAILS_DIR: ${{ github.workspace }}/.alert-details

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine show to run
        id: show
        # Every trigger arrives as workflow_dispatch (Cloudflare Worker cron or manual UI)
        # since the 2026-06-11 migration removed schedule: blocks — no day-of-week fallback.
        run: |
          echo "show_id=${{ inputs.show_id }}" >> $GITHUB_OUTPUT
          echo "dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: DB preflight (fail fast if Neon is unreachable from this runner)
        # One bounded connect attempt before any real work. On 2026-08-31 a runner with
        # a dead path to the pooler spent 41 minutes rediscovering that in every step;
        # this ends the job in about a minute and Slacks the diagnostics instead.
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: cd pipeline && python db_preflight.py

      - name: Reconstruct Spotify cache
        id: spotify_cache
        # Through env, not ${{ }} inside the script: interpolating a secret into shell
        # text is GitHub's documented injection anti-pattern, and it breaks the day the
        # cache JSON contains a single quote. Every other secret in this file uses env.
        env:
          SPOTIFY_CACHE_JSON: ${{ secrets.SPOTIFY_CACHE_JSON }}
        run: |
          mkdir -p .spotify_cache
          printf '%s' "$SPOTIFY_CACHE_JSON" > .spotify_cache/.cache

      - name: Run pipeline
        id: pipeline
        # Step-level timeout (< job timeout) so a hang FAILS this step (→ Slack alert)
        # instead of cancelling the job, which would skip the if:failure() notify.
        timeout-minutes: 25
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          # TAL's discovery step imports new episodes from Taddy before scraping songs.
          TADDY_USER_ID: ${{ secrets.TADDY_USER_ID }}
          TADDY_API_KEY: ${{ secrets.TADDY_API_KEY }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ steps.show.outputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          cd pipeline
          python run_pipeline.py \
            --show-id ${{ steps.show.outputs.show_id }} \
            --yes \
            --cache-path ../.spotify_cache/.cache \
            --json \
            $DRY_RUN_FLAG \
            2>&1 | tee ../pipeline_output.txt

          # Extract JSON summary for later steps
          sed -n '/--- JSON SUMMARY ---/,$ p' ../pipeline_output.txt | tail -n +2 > ../summary.json

      # The silent-gap alarm. A music run that discovers nothing looks EXACTLY like a
      # run with nothing to discover — that is how TAL sat 6 episodes behind its feed
      # for ten weeks while every Monday run exited 0. Asking the feed (not the DB)
      # whether we are caught up is the only way this run can prove it did its job.
      # Scoped to the show that just ran: one Taddy call, not one per show.
      - name: Feed second-source check (did this run actually catch up?)
        id: feed_check
        if: steps.show.outputs.dry_run != 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TADDY_USER_ID: ${{ secrets.TADDY_USER_ID }}
          TADDY_API_KEY: ${{ secrets.TADDY_API_KEY }}
          SHOW_ID: ${{ steps.show.outputs.show_id }}
        run: |
          case "$SHOW_ID" in
            1) SLUGS="sop" ;;
            2) SLUGS="tal" ;;
            all) SLUGS="sop,tal" ;;
            *) echo "No feed second-source for show_id=$SHOW_ID — skipping."; exit 0 ;;
          esac

          # --strict: BEHIND exits non-zero, failing this step; the announce step reads
          # which show and why from --results-file and says it once.
          cd pipeline
          python data_health.py --feed-check-only --shows "$SLUGS" --strict \
            --results-file "$ALERT_DETAILS_DIR/health.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write job summary
        if: always()
        run: |
          SHOW_ID="${{ steps.show.outputs.show_id }}"
          DRY_RUN="${{ steps.show.outputs.dry_run }}"

          # Map show IDs to names
          case $SHOW_ID in
            1) SHOW_NAME="SOP (Switched On Pop)" ;;
            2) SHOW_NAME="TAL (This American Life)" ;;
            3) SHOW_NAME="AI Daily Brief" ;;
            all) SHOW_NAME="All Shows" ;;
          esac

          echo "## Pipeline Run: $SHOW_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$DRY_RUN" = "true" ]; then
            echo "> **Dry run** - no changes were made" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f summary.json ] && [ -s summary.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat summary.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No JSON summary available. Check logs for details." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      # No per-run success ping — it's noise (the run summary lives in the job summary,
      # and the biweekly pulse is the positive report). Failures are scoped to the show
      # that ran: a TAL run can't close an SOP failure.
      # The run's one voice (pipeline/announce.py): Slack and the failure issues, once per
      # change of state — a new failure, a changed set of failures, "recovered" on the
      # first green — plus a weekly reminder while a failure lasts. Always runs, so a green
      # run can close what it fixed. Replaced (2026-09-23) the separate speakers that made
      # every red day two pings and a comment on an issue that never closed.
      - name: Announce (Slack + failure issues, once per change)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN_INPUT: ${{ steps.show.outputs.dry_run }}
          SHOW_ID: ${{ steps.show.outputs.show_id }}
        # python3, standard library only: this must still run when setup or the
        # dependency install is what failed.
        run: |
          ARGS=(--workflow music --show-id "$SHOW_ID")
          [ "$DRY_RUN_INPUT" = "true" ] && ARGS+=(--dry-run)
          python3 pipeline/announce.py "${ARGS[@]}"
