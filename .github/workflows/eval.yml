name: Extraction Eval (tech shows)

# The honest gradient for the one LLM step (entity extraction). Runs the frozen eval set
# and fails (+ Slacks) if a stable signal breaches its floor — so a silent model drift, or
# a candidate model you're trialing, can't ship on vibes. See evals/README.md.
#
# No `schedule:` block on purpose: the durable trigger is the Cloudflare Worker
# (cloudflare-trigger/), which dispatches this weekly. GitHub disables public-repo crons
# after 60 idle days — the exact trap the rest of this pipeline was moved off of.
# shell: bash turns on pipefail for run steps — without it, `cmd | tee` reports tee's
# exit code and a crashed script reads as "success" (bit pipeline.yml for six weeks).
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to re-extract with (blank = current default)'
        required: false
        default: ''
      mode:
        description: 'both | baseline | gold'
        required: false
        default: 'both'
      limit:
        description: 'Only score the first N episodes (blank = all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  run-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run extraction eval (gated)
        # Step-level timeout < job timeout so a hang FAILS this step (-> Slack) instead of
        # cancelling the job and skipping the if:failure() notify.
        timeout-minutes: 25
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MODEL_INPUT: ${{ github.event.inputs.model }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
          LIMIT_INPUT: ${{ github.event.inputs.limit }}
        run: |
          set -euo pipefail
          # Build args as a quoted array so each input is exactly one argument — no
          # word-splitting/globbing/metachar reinterpretation of the env-var inputs.
          ARGS=(--ci --mode "${MODE_INPUT:-both}" --json eval_report.json)
          if [ -n "${MODEL_INPUT:-}" ]; then ARGS+=(--model "${MODEL_INPUT}"); fi
          if [ -n "${LIMIT_INPUT:-}" ]; then ARGS+=(--limit "${LIMIT_INPUT}"); fi
          python evals/extraction/run_eval.py "${ARGS[@]}"

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.json
          if-no-files-found: ignore

      - name: Notify Slack (failure)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS --retry 3 -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            --data "{\"text\": \":rotating_light: *list-maker: extraction eval FAILED* — extraction quality moved past a floor.\n<${RUN_URL}|View logs>\"}"
