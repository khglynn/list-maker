# Dependabot: version-update PRs for the three ecosystems this repo actually runs.
# Added 2026-09-01 — until then the repo had no dependabot config AND vulnerability
# alerts were switched off (a public repo where GitHub's default is on), so the entire
# advisory feed was silently unchecked. Alerts + security updates were enabled the
# same day via the API. Grouped minor/patch bumps keep the PR count to one per
# ecosystem per week; majors arrive alone and get a human's eyes (never blind-merge a
# major — see the dependency-security guide in hg-ground-it).
#
# No npm ecosystem: the unused Next.js scaffold (web/) was deleted 2026-09-01.
version: 2
updates:
  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: weekly
      day: thursday
    # 7-day soak, majors 30 (stamped from repo-standards). pip has no install-time
    # release-age setting, so this cooldown is the only wait on these packages.
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /marketing
    schedule:
      interval: weekly
      day: thursday
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
  # The Cloudflare Worker that receives GitHub webhooks and starts pipeline runs. It has its
  # own package.json (wrangler + a tiny test), so it needs its own Dependabot entry —
  # nothing above watches it. Added 2026-09-14 after bin/enroll in repo-standards flagged it.
  - package-ecosystem: npm
    directory: /cloudflare-trigger
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 3
    # Same 7 days as the .npmrc min-release-age, so a PR never proposes what npm would refuse.
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      cf-trigger-minor-and-patch:
        update-types: [minor, patch]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
